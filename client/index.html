<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Equoria - ReflectAI</title>
    <meta
      name="description"
      content="A private journaling workspace with memory-aware reflective conversations, mood tracking, and evidence-based prompts."
    />
    <meta name="theme-color" content="#F4EFE2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- No dedicated og-image asset yet -- title/description alone still
         give link previews something real instead of nothing, and adding a
         generated share-card image (same pattern as Year in Review's
         downloadShareCard) is a reasonable follow-up rather than a blocker
         for a private, account-gated app that's rarely actually shared as a
         link. -->
    <meta property="og:title" content="Equoria - ReflectAI" />
    <meta
      property="og:description"
      content="A private journaling workspace with memory-aware reflective conversations, mood tracking, and evidence-based prompts."
    />
    <meta property="og:type" content="website" />
    <!-- v3 typography: Space Grotesk (bold geometric display, replacing the
         Fraunces serif) + Inter (workhorse body sans, replacing Manrope) +
         JetBrains Mono (replacing IBM Plex Mono) for metadata/data text via
         .ui-kicker/.ui-mono. Deliberately a different pairing family from
         every earlier pass -- no serif anywhere in this system. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F4EFE2]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
