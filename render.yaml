services:
  - type: web
    name: reflectai-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_ISSUER
        value: reflectai
      - key: JWT_AUDIENCE
        value: reflectai-client
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_FALLBACK_MODE
        value: manual
      - key: USE_OLLAMA
        value: false
      - key: OLLAMA_BASE_URL
        value: http://127.0.0.1:11434
      - key: OLLAMA_MODEL
        value: llama3.2:3b
      - key: CLIENT_URL
        sync: false
      - key: DEMO_EMAIL
        value: demo@reflectai.com
      - key: DEMO_PASSWORD
        value: Demo@123

  - type: web
    name: reflectai-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
